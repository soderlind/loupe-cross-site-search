name: On Release, Build release zip

on:
  release:
    types: [published]

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build assets
        run: |
          npm ci
          npm run build

      - name: Install runtime dependencies (bundles Action Scheduler)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Stage release files
        run: |
          mkdir -p /tmp/loupe-cross-site-search
          rsync -a \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude-from='.distignore' \
            . /tmp/loupe-cross-site-search/

      - name: Archive Release
        working-directory: /tmp
        run: zip -r ${{ github.workspace }}/loupe-cross-site-search.zip loupe-cross-site-search/

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            loupe-cross-site-search.zip \
            --clobber
